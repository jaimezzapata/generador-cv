<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <rect width="320" height="220" rx="8" fill="#F1F5F9"/>
  <rect x="24" y="14" width="272" height="192" rx="4" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- Minerva Blue Top Header Bar -->
  <rect x="24" y="14" width="272" height="24" rx="3" fill="#1E3A8A"/>
  <text x="160" y="30" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="8.5" font-weight="900" letter-spacing="1">HOJA DE VIDA · FORMATO MINERVA 1003</text>
  <!-- Gray Sub-banner -->
  <rect x="24" y="38" width="272" height="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="32" y="46.5" fill="#334155" font-family="sans-serif" font-size="6.5" font-weight="bold">DATOS DE IDENTIFICACIÓN PERSONAL</text>
  <text x="288" y="46.5" text-anchor="end" fill="#1E3A8A" font-family="sans-serif" font-size="6.5" font-weight="bold">AZUL Y GRIS</text>
  
  <!-- Identity & Photo Grid -->
  <rect x="32" y="54" width="186" height="34" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="125" y1="54" x2="125" y2="88" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="32" y1="71" x2="218" y2="71" stroke="#E2E8F0" stroke-width="0.8"/>
  <rect x="38" y="59" width="60" height="4" rx="1.5" fill="#1E3A8A"/>
  <rect x="131" y="59" width="55" height="4" rx="1.5" fill="#475569"/>
  <rect x="38" y="77" width="70" height="4" rx="1.5" fill="#64748B"/>
  <rect x="131" y="77" width="62" height="4" rx="1.5" fill="#64748B"/>
  
  <!-- Photo Slot on Top Right -->
  <rect x="228" y="54" width="60" height="34" rx="2" fill="#F1F5F9" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="258" y="73" text-anchor="middle" fill="#1E3A8A" font-family="sans-serif" font-size="6" font-weight="bold">FOTO 3×4</text>
  
  <!-- Section 1: Perfil Ocupacional -->
  <rect x="32" y="94" width="256" height="13" rx="2" fill="#1E3A8A"/>
  <text x="40" y="103" fill="#FFFFFF" font-family="sans-serif" font-size="6.5" font-weight="bold">I. PERFIL OCUPACIONAL</text>
  <rect x="32" y="110" width="256" height="18" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
  <rect x="38" y="115" width="230" height="3" rx="1" fill="#475569"/>
  <rect x="38" y="121" width="180" height="3" rx="1" fill="#94A3B8"/>
  
  <!-- Section 2: Experiencia Laboral -->
  <rect x="32" y="133" width="256" height="13" rx="2" fill="#1E3A8A"/>
  <text x="40" y="142" fill="#FFFFFF" font-family="sans-serif" font-size="6.5" font-weight="bold">II. EXPERIENCIA LABORAL</text>
  <rect x="32" y="149" width="256" height="24" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <rect x="38" y="154" width="110" height="4" rx="1.5" fill="#0F172A"/>
  <rect x="38" y="161" width="80" height="3" rx="1" fill="#1E3A8A"/>
  <rect x="38" y="166" width="210" height="3" rx="1" fill="#64748B"/>
  
  <!-- Section 3: Referencias Personales y Familiares -->
  <rect x="32" y="178" width="256" height="13" rx="2" fill="#1E3A8A"/>
  <text x="40" y="187" fill="#FFFFFF" font-family="sans-serif" font-size="6.5" font-weight="bold">III. REFERENCIAS FAMILIARES Y PERSONALES</text>
  <rect x="32" y="194" width="124" height="9" rx="1.5" fill="#E2E8F0"/>
  <rect x="164" y="194" width="124" height="9" rx="1.5" fill="#E2E8F0"/>
</svg>
