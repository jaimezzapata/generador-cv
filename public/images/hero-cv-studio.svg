<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <!-- Studio Backdrop Canvas -->
  <rect width="560" height="400" rx="16" fill="#0F172A"/>
  <circle cx="480" cy="70" r="110" fill="#1E293B" opacity="0.6"/>
  <circle cx="80" cy="340" r="90" fill="#1E293B" opacity="0.6"/>

  <!-- Main A4 Resume Sheet -->
  <rect x="130" y="28" width="290" height="344" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Resume Header -->
  <rect x="150" y="48" width="48" height="48" rx="10" fill="#2563EB"/>
  <text x="174" y="78" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">CV</text>
  <rect x="210" y="54" width="140" height="12" rx="4" fill="#0F172A"/>
  <rect x="210" y="72" width="105" height="8" rx="3" fill="#2563EB"/>
  <rect x="210" y="86" width="80" height="6" rx="3" fill="#94A3B8"/>

  <!-- Block 1: AI Summary Block -->
  <rect x="150" y="110" width="250" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="162" y="120" width="90" height="7" rx="3" fill="#0F172A"/>
  <rect x="162" y="134" width="224" height="5" rx="2.5" fill="#64748B"/>
  <rect x="162" y="144" width="206" height="5" rx="2.5" fill="#64748B"/>
  <rect x="162" y="154" width="160" height="5" rx="2.5" fill="#94A3B8"/>

  <!-- Block 2: Active Draggable Block (Popped Out) -->
  <g transform="translate(-14, -6)">
    <rect x="154" y="184" width="262" height="68" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <!-- Drag Handle Dots -->
    <circle cx="170" cy="210" r="2.2" fill="#2563EB"/>
    <circle cx="170" cy="218" r="2.2" fill="#2563EB"/>
    <circle cx="170" cy="226" r="2.2" fill="#2563EB"/>
    <circle cx="177" cy="210" r="2.2" fill="#2563EB"/>
    <circle cx="177" cy="218" r="2.2" fill="#2563EB"/>
    <circle cx="177" cy="226" r="2.2" fill="#2563EB"/>
    <rect x="190" y="198" width="136" height="8" rx="3" fill="#1E3A8A"/>
    <rect x="190" y="213" width="196" height="5" rx="2.5" fill="#3B82F6"/>
    <rect x="190" y="224" width="164" height="5" rx="2.5" fill="#60A5FA"/>
    <rect x="344" y="195" width="58" height="16" rx="8" fill="#2563EB"/>
    <text x="373" y="206" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold">SENA / ATS</text>
  </g>

  <!-- Block 3: Experience Block -->
  <rect x="150" y="258" width="250" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="162" y="270" width="112" height="7" rx="3" fill="#0F172A"/>
  <rect x="162" y="284" width="218" height="5" rx="2.5" fill="#64748B"/>
  <rect x="162" y="294" width="194" height="5" rx="2.5" fill="#64748B"/>
  <rect x="162" y="304" width="140" height="5" rx="2.5" fill="#94A3B8"/>

  <!-- Skill Pills Bottom -->
  <rect x="150" y="332" width="56" height="18" rx="9" fill="#E0E7FF"/>
  <rect x="214" y="332" width="64" height="18" rx="9" fill="#DCFCE7"/>
  <rect x="286" y="332" width="52" height="18" rx="9" fill="#FEF3C7"/>

  <!-- Floating Left Badge: Drag & Drop -->
  <rect x="24" y="84" width="138" height="56" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <rect x="36" y="96" width="32" height="32" rx="8" fill="#FEF3C7"/>
  <text x="52" y="117" text-anchor="middle" font-family="sans-serif" font-size="16">🧩</text>
  <text x="76" y="110" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Drag &amp; Drop</text>
  <text x="76" y="124" fill="#475569" font-family="sans-serif" font-size="8.5">Bloques Modulares</text>

  <!-- Floating Right Badge: AI Writer -->
  <rect x="386" y="68" width="150" height="58" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <rect x="398" y="81" width="32" height="32" rx="8" fill="#F3E8FF"/>
  <text x="414" y="102" text-anchor="middle" font-family="sans-serif" font-size="16">✨</text>
  <text x="438" y="95" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">Redacción IA</text>
  <text x="438" y="109" fill="#475569" font-family="sans-serif" font-size="8.5">Logros y Perfil</text>

  <!-- Floating Bottom Right Badge: PDF Export -->
  <rect x="392" y="280" width="144" height="62" rx="12" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
  <rect x="406" y="295" width="32" height="32" rx="8" fill="#FFFFFF"/>
  <text x="422" y="315" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="11" font-weight="bold">PDF</text>
  <text x="448" y="308" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold">Listo A4 / Carta</text>
  <text x="448" y="322" fill="#ECFDF5" font-family="sans-serif" font-size="8.5">Descarga Directa</text>
</svg>
